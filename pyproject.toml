[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lavora_e_guida"
version = "0.1.0"
description = "Ecosistema agentico vocale hands-free (WSL orchestrator + Windows audio host)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "rich>=13",
]

[project.optional-dependencies]
crewai = ["crewai"]
autogen = ["autogen-agentchat", "autogen-ext"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lavora-e-guida = "lavora_e_guida.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
